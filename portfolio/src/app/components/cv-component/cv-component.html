<div class="cv-wrapper">
  <div class="card">
    <div class="card-header">
      <h2>{{'my-cv' | translate}}</h2>
    <button class="btn-add" type="button" (click)="onAddClick()">{{'add-button' | translate}}</button>
    </div>

    <table class="cv-table">
      <thead>
        <tr>
          <th>{{'employer' | translate}}</th>
          <th>{{'start' | translate}}</th>
          <th>{{'end' | translate}}</th>
          <th *ngIf="isEditingAllowed" class="th-actions"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cvs; let i = index">
          <td>{{ c.company }}</td>
          <td>{{ c.from }}</td>
          <td>{{ c.to || '' }}</td>
          <td *ngIf="isEditingAllowed" class="td-actions">
            <button class="icon" title="delete" (click)="delete(i)">×</button>
          </td>
        </tr>

        <tr *ngIf="showEditor">
          <td><input [(ngModel)]="newCompany" placeholder="Employer"></td>
          <td><input type="number" [(ngModel)]="newFrom" placeholder="Start"></td>
          <td><input type="number" [(ngModel)]="newTo" placeholder="End"></td>
          <td class="td-actions">
            <button class="btn" (click)="saveNew()">{{'cv-save-button' | translate}}</button>
            <button class="btn ghost" (click)="showEditor=false">{{'cv-cancel-button' | translate}}</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<div class="cv-modal-backdrop" *ngIf="showLogin" (click)="closeLogin()">
  <div class="cv-modal" (click)="$event.stopPropagation()">
    <h3>Login</h3>
    <input type="password" [(ngModel)]="password" placeholder="Passwort">
    <div class="cv-modal-actions">
      <button class="btn" (click)="checkPassword()">{{'login-ok' | translate}}</button>
      <button class="btn ghost" (click)="closeLogin()">{{'login-cancel' | translate}}</button>
    </div>
  </div>
</div>
